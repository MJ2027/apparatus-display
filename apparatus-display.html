<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine 702 Apparatus Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        
        /* Standby Screen */
        .standby-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
        }
        
        .standby-logo {
            width: 400px;
            height: 400px;
            margin-bottom: 30px;
        }
        
        .standby-shift {
            font-size: 4em;
            font-weight: bold;
            color: #ff8800;
            margin-bottom: 20px;
        }
        
        .standby-time {
            font-size: 3em;
            color: #cccccc;
        }
        
        /* Alert Screen */
        .alert-screen {
            display: none;
            height: 100vh;
        }
        
        .alert-screen.active {
            display: flex;
            flex-direction: column;
        }
        
        .alert-header {
            background: rgba(255, 140, 0, 0.98);
            padding: 25px;
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            border-bottom: 8px solid #ff6600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .alert-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .alert-left {
            flex: 1;
            background: white;
            position: relative;
            border-right: 4px solid #333;
            overflow: hidden;
        }
        
        .alert-right {
            flex: 1;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .alert-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* FIXED: Street View now fills entire right panel */
        .alert-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .panel-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 25px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            z-index: 100;
            border: 2px solid #ff8800;
        }
    </style>
</head>
<body>
    <!-- Standby Screen -->
    <div id="standbyScreen" class="standby-screen">
        <iframe src="http://10.2.1.111/FSASPortal/Pages/ScreenView.aspx?location=-1&limit=20&fsize=35&refresh=1" 
                style="width: 100%; height: 100%; border: none; background: black;">
        </iframe>
    </div>
    
    <!-- Alert Screen -->
    <div id="alertScreen" class="alert-screen">
        <div class="alert-header" id="alertHeader">ENGINE 702 - Loading...</div>
        <div class="alert-container">
            <div class="alert-left">
                <div class="panel-label">LOCATION MAP</div>
                <iframe id="mapsFrame" class="alert-iframe"></iframe>
            </div>
            <div class="alert-right">
                <div class="panel-label">BUILDING VIEW</div>
                <img id="streetViewImage" class="alert-image" alt="Street View">
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <script>
       // Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAudqZKq4Ri84QS5hAMwQzIGmsUeRKNaPQ",
  authDomain: "tacoma-park-city-fire.firebaseapp.com",
  databaseURL: "https://tacoma-park-city-fire-default-rtdb.firebaseio.com",
  projectId: "tacoma-park-city-fire",
  storageBucket: "tacoma-park-city-fire.firebasestorage.app",
  messagingSenderId: "176769198060",
  appId: "1:176769198060:web:b0448742b90bf724e7c2c9"
};

        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // UI Elements
        const standbyScreen = document.getElementById('standbyScreen');
        const alertScreen = document.getElementById('alertScreen');
        const alertHeader = document.getElementById('alertHeader');
        const mapsFrame = document.getElementById('mapsFrame');
        const streetViewImage = document.getElementById('streetViewImage');
        
        let alertTimeout = null;
        
        // Show standby screen
        function showStandby() {
            standbyScreen.style.display = 'flex';
            alertScreen.classList.remove('active');
        }
        
        // FIXED: Enhanced map URL builder with Maryland geocoding and coordinate fallback
        function buildEnhancedMapUrl(address, mapsUrl, lat, lon) {
            // Strategy 1: If we have coordinates from PowerShell (MOST RELIABLE)
            if (lat && lon) {
                console.log('[MAP] Using coordinates:', lat, lon);
                return `https://www.google.com/maps/embed/v1/view?key=AIzaSyDpkfbB4N_a2s0PPY_e7rt8o3R5efWa5wc&center=${lat},${lon}&zoom=18&maptype=roadmap`;
            }
            
            // Strategy 2: Extract query from existing URL and enhance with Maryland
            if (mapsUrl && mapsUrl.includes('query=')) {
                const query = mapsUrl.split('query=')[1].split('&')[0];
                const decodedQuery = decodeURIComponent(query);
                
                // Add Maryland and USA for better geocoding
                const enhancedQuery = encodeURIComponent(`${decodedQuery}, Maryland, USA`);
                
                // FIXED: Zoom set to 18 for street-level, with DC metro area bias
                const dcMetroLat = 38.9897;  // Takoma Park area
                const dcMetroLon = -77.0089;
                
                console.log('[MAP] Using enhanced address search:', decodedQuery + ', Maryland, USA');
                return `https://www.google.com/maps/embed/v1/place?key=AIzaSyDpkfbB4N_a2s0PPY_e7rt8o3R5efWa5wc&q=${enhancedQuery}&zoom=18&center=${dcMetroLat},${dcMetroLon}&region=US`;
            }
            
            // Strategy 3: Fallback - build from scratch with address
            const enhancedAddress = encodeURIComponent(`${address}, Montgomery County, Maryland, USA`);
            const dcMetroLat = 38.9897;
            const dcMetroLon = -77.0089;
            
            console.log('[MAP] Using fallback address search:', address);
            return `https://www.google.com/maps/embed/v1/place?key=AIzaSyDpkfbB4N_a2s0PPY_e7rt8o3R5efWa5wc&q=${enhancedAddress}&zoom=18&center=${dcMetroLat},${dcMetroLon}&region=US`;
        }
        
        // Show alert screen
        function showAlert(address, mapsUrl, streetViewUrl, lat, lon) {
            console.log('[ALERT] Displaying:', address);
            console.log('[ALERT] Coordinates:', lat, lon);
            console.log('[ALERT] Original maps URL:', mapsUrl);
            
            // Update header
            alertHeader.textContent = `ENGINE 702 - ${address}`;
            
            // FIXED: Build enhanced map URL with all fallback strategies
            const enhancedMapUrl = buildEnhancedMapUrl(address, mapsUrl, lat, lon);
            
            mapsFrame.src = enhancedMapUrl;
            streetViewImage.src = streetViewUrl;
            
            // Switch to alert screen
            standbyScreen.style.display = 'none';
            alertScreen.classList.add('active');
            
            // Clear any existing timeout
            if (alertTimeout) {
                clearTimeout(alertTimeout);
            }
            
            // Return to standby after 10 minutes
            alertTimeout = setTimeout(() => {
                console.log('[ALERT] Timeout - returning to standby');
                showStandby();
            }, 600000); // 10 minutes
        }
        
        // Listen for alert updates from Firebase
        database.ref('apparatus/current_alert').on('value', (snapshot) => {
            const alert = snapshot.val();
            
            if (alert && alert.active) {
                console.log('[FIREBASE] Alert received:', alert);
                
                // Extract coordinates if available (multiple possible field names)
                const lat = alert.latitude || alert.lat || null;
                const lon = alert.longitude || alert.lon || alert.lng || null;
                
                showAlert(alert.address, alert.mapsUrl, alert.streetViewUrl, lat, lon);
            } else {
                console.log('[FIREBASE] No active alert');
                showStandby();
            }
        });
        
        // Initial state
        showStandby();
        
        console.log('[INIT] Apparatus display ready');
    </script>
</body>
</html>
